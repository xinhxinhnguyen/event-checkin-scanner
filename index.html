  </div>

<script>


/* =====================================================
   1. CẤU HÌNH WEB APP
===================================================== */


const API_URL =
  "https://script.google.com/a/macros/onemount.com/s/AKfycbzfwD-X_7FejJurxja-dpJR3l1WwQT7aGOAUEruBPeMshdE9s0dp8x9Te--NDh6sTD_xg/exec";


/* =====================================================
   2. BIẾN TOÀN CỤC
===================================================== */


let html5QrCode = null;

let currentEventId = "";

let currentCustomerId = "";

let isProcessing = false;


/* =====================================================
   3. HIỂN THỊ MESSAGE
===================================================== */


function showMessage(text, type) {

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.className =
    "message " + type;

  message.style.display =
    "block";

}


/* =====================================================
   4. ẨN MESSAGE
===================================================== */


function hideMessage() {

  const message =
    document.getElementById("message");

  message.style.display =
    "none";

}


/* =====================================================
   5. HIỂN THỊ LOADING
===================================================== */


function showLoading(show) {

  document
    .getElementById("loading")
    .style.display =
      show ? "block" : "none";

}


/* =====================================================
   6. BẮT ĐẦU QUÉT CAMERA
===================================================== */


async function startScanner() {

  hideMessage();

  document
    .getElementById("customerInfo")
    .style.display = "none";

  document
    .getElementById("qrDebug")
    .style.display = "none";


  if (html5QrCode) {

    return;

  }


  try {

    html5QrCode =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      }

    };


    await html5QrCode.start(

      {
        facingMode: "environment"
      },

      config,

      function(decodedText) {

        onScanSuccess(decodedText);

      },

      function(errorMessage) {

        // Không xử lý lỗi scan liên tục

      }

    );


    document
      .getElementById("startBtn")
      .disabled = true;


    showMessage(

      "Camera đã sẵn sàng. Hãy đưa mã QR vào khung quét.",

      "success"

    );


  } catch (error) {

    console.error(
      "CAMERA ERROR:",
      error
    );


    html5QrCode =
      null;


    showMessage(

      "Không thể mở camera. " +
      "Vui lòng kiểm tra quyền Camera của trình duyệt.",

      "error"

    );

  }

}


/* =====================================================
   7. QUÉT QR THÀNH CÔNG
===================================================== */


async function onScanSuccess(decodedText) {

  if (isProcessing) {

    return;

  }


  isProcessing = true;


  console.log(
    "QR SCAN:",
    decodedText
  );


  document
    .getElementById("qrText")
    .textContent =
      decodedText;


  document
    .getElementById("qrDebug")
    .style.display =
      "block";


  await stopScanner();


  parseQRCode(decodedText);

}


/* =====================================================
   8. DỪNG CAMERA
===================================================== */


async function stopScanner() {

  if (!html5QrCode) {

    return;

  }


  try {

    await html5QrCode.stop();

    await html5QrCode.clear();

  } catch (error) {

    console.log(
      "STOP CAMERA:",
      error
    );

  }


  html5QrCode =
    null;

}


/* =====================================================
   9. PHÂN TÍCH QR
=====================================================

   QR:

   EVT001|KH002

===================================================== */


function parseQRCode(qrText) {

  const parts =
    String(qrText)
      .trim()
      .split("|");


  if (parts.length < 2) {

    isProcessing = false;


    showMessage(

      "QR Code không đúng định dạng. " +
      "Định dạng yêu cầu: EVT001|KH002",

      "error"

    );


    return;

  }


  currentEventId =
    parts[0].trim();


  currentCustomerId =
    parts[1].trim();


  if (
    !currentEventId ||
    !currentCustomerId
  ) {

    isProcessing = false;


    showMessage(

      "QR Code thiếu EVENT_ID hoặc CUSTOMER_ID.",

      "error"

    );


    return;

  }


  console.log(
    "EVENT_ID:",
    currentEventId
  );


  console.log(
    "CUSTOMER_ID:",
    currentCustomerId
  );


  getCustomer();

}


/* =====================================================
   10. GỌI WEB APP LẤY KHÁCH HÀNG
===================================================== */


async function getCustomer() {

  showLoading(true);


  const url =

    API_URL +

    "?action=getCustomer" +

    "&eventId=" +

    encodeURIComponent(
      currentEventId
    ) +

    "&customerId=" +

    encodeURIComponent(
      currentCustomerId
    );


  console.log(
    "API URL:",
    url
  );


  try {

    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "API RESULT:",
      data
    );


    showLoading(false);


    if (!data.success) {

      showMessage(

        data.message ||
        "Không tìm thấy khách hàng.",

        "error"

      );


      isProcessing = false;


      return;

    }


    displayCustomer(data);


  } catch (error) {

    console.error(
      "API ERROR:",
      error
    );


    showLoading(false);


    showMessage(

      "Không thể kết nối Web App. " +
      "Vui lòng kiểm tra lại Web App URL hoặc quyền truy cập.",

      "error"

    );


    isProcessing = false;

  }

}


/* =====================================================
   11. HIỂN THỊ THÔNG TIN KHÁCH
===================================================== */


function displayCustomer(data) {


  document
    .getElementById("customerInfo")
    .style.display =
      "block";


  document
    .getElementById("customerName")
    .textContent =
      data.customerName || "";


  document
    .getElementById("sales")
    .textContent =
      data.sales || "";


  document
    .getElementById("agency")
    .textContent =
      data.agency || "";


  document
    .getElementById("registerQty")
    .textContent =
      data.registerQty || 0;


  const alreadyCheckin =
    document.getElementById(
      "alreadyCheckin"
    );


  const qtyBox =
    document.getElementById(
      "qtyBox"
    );


  const checkinBtn =
    document.getElementById(
      "checkinBtn"
    );


  if (
    data.checkinStatus ===
    "ĐÃ CHECK-IN"
  ) {


    alreadyCheckin.style.display =
      "block";


    qtyBox.style.display =
      "none";


    checkinBtn.style.display =
      "none";


    document
      .getElementById("checkinBy")
      .textContent =
        data.checkinBy || "";


    document
      .getElementById("checkinTime")
      .textContent =
        formatDateTime(
          data.checkinTime
        );


    showMessage(

      "⚠️ Khách hàng này đã check-in trước đó.",

      "warning"

    );


  } else {


    alreadyCheckin.style.display =
      "none";


    qtyBox.style.display =
      "block";


    checkinBtn.style.display =
      "block";


    document
      .getElementById("actualQty")
      .value =
        data.registerQty || 1;


    showMessage(

      "✅ Đã tìm thấy khách hàng. " +
      "Vui lòng nhập số lượng thực tế.",

      "success"

    );

  }


  isProcessing = false;

}


/* =====================================================
   12. XÁC NHẬN CHECK-IN
===================================================== */


async function confirmCheckin() {


  const actualQty =
    Number(
      document
        .getElementById("actualQty")
        .value
    );


  if (
    !Number.isInteger(actualQty) ||
    actualQty < 0
  ) {

    showMessage(

      "Vui lòng nhập số lượng khách hợp lệ.",

      "error"

    );


    return;

  }


  if (
    !currentEventId ||
    !currentCustomerId
  ) {

    showMessage(

      "Chưa có thông tin khách hàng.",

      "error"

    );


    return;

  }


  showLoading(true);


  const url =

    API_URL +

    "?action=checkin" +

    "&eventId=" +

    encodeURIComponent(
      currentEventId
    ) +

    "&customerId=" +

    encodeURIComponent(
      currentCustomerId
    ) +

    "&actualQty=" +

    encodeURIComponent(
      actualQty
    );


  console.log(
    "CHECK-IN URL:",
    url
  );


  try {

    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "CHECK-IN RESULT:",
      data
    );


    showLoading(false);


    if (data.success) {


      showMessage(

        "✅ CHECK-IN THÀNH CÔNG",

        "success"

      );


      document
        .getElementById("qtyBox")
        .style.display =
          "none";


      document
        .getElementById("checkinBtn")
        .style.display =
          "none";


      document
        .getElementById("alreadyCheckin")
        .style.display =
          "block";


      document
        .getElementById("checkinBy")
        .textContent =
          data.checkinBy || "";


      document
        .getElementById("checkinTime")
        .textContent =
          formatDateTime(
            data.checkinTime
          );


    } else {


      if (data.alreadyCheckin) {


        showMessage(

          "⚠️ Khách hàng đã check-in trước đó.",

          "warning"

        );


        document
          .getElementById("qtyBox")
          .style.display =
            "none";


        document
          .getElementById("checkinBtn")
          .style.display =
            "none";


        document
          .getElementById("alreadyCheckin")
          .style.display =
            "block";


        document
          .getElementById("checkinBy")
          .textContent =
            data.checkinBy || "";


        document
          .getElementById("checkinTime")
          .textContent =
            formatDateTime(
              data.checkinTime
            );


      } else {


        showMessage(

          data.message ||
          "Check-in thất bại.",

          "error"

        );

      }

    }

  } catch (error) {


    console.error(
      "CHECK-IN ERROR:",
      error
    );


    showLoading(false);


    showMessage(

      "Không thể kết nối Web App.",

      "error"

    );

  }

}


/* =====================================================
   13. QUÉT KHÁCH HÀNG KHÁC
===================================================== */


async function resetScanner() {


  await stopScanner();


  currentEventId =
    "";

  currentCustomerId =
    "";

  isProcessing =
    false;


  document
    .getElementById("customerInfo")
    .style.display =
      "none";


  document
    .getElementById("qrDebug")
    .style.display =
      "none";


  document
    .getElementById("alreadyCheckin")
    .style.display =
      "none";


  document
    .getElementById("qtyBox")
    .style.display =
      "block";


  document
    .getElementById("checkinBtn")
    .style.display =
      "block";


  document
    .getElementById("startBtn")
    .disabled =
      false;


  hideMessage();


  startScanner();

}


/* =====================================================
   14. FORMAT NGÀY GIỜ
===================================================== */


function formatDateTime(value) {


  if (!value) {

    return "";

  }


  const date =
    new Date(value);


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return value;

  }


  return date.toLocaleString(

    "vi-VN",

    {

      day:
        "2-digit",

      month:
        "2-digit",

      year:
        "numeric",

      hour:
        "2-digit",

      minute:
        "2-digit",

      second:
        "2-digit"

    }

  );

}


</script>
